name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-progress runs when a new workflow is triggered for the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job to detect changes in specific paths to conditionally run integration tests
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            integration:
              - 'integration-tests/**'

  build:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt (Lint)
        run: ./gradlew detekt

      - name: Build Project
        run: ./gradlew assemble

      - name: Run Tests and Coverage
        # Using check to run all tests compatible with the host (including Apple targets on macOS)
        run: ./gradlew check koverHtmlReport koverXmlReport

      - name: Report Test Results
        if: always()
        run: python scripts/report_tests.py >> $GITHUB_STEP_SUMMARY

      - name: Report Coverage
        if: always()
        run: python scripts/report_coverage.py >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: build/reports/kover/html

  build-samples:
    name: Build Samples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Samples
        run: ./gradlew :samples:assemble -PincludeSamples=true

  integration-tests:
    name: Integration Tests
    needs: [build, detect-changes]
    runs-on: ubuntu-latest
    # Run on:
    # 1. Pushes to main (merges)
    # 2. Pull requests originating from release/* branches
    # 3. Any pull request that modifies files in the integration-tests/ directory
    if: |
      github.ref == 'refs/heads/main' || 
      (github.event_name == 'pull_request' && (
        startsWith(github.head_ref, 'release/') || 
        needs.detect-changes.outputs.integration == 'true'
      ))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Integration Tests
        run: ./gradlew :integration-tests:integrationTest -PTEST_MAL_CLIENT_ID=${{ secrets.TEST_MAL_CLIENT_ID }}

      - name: Report Integration Test Results
        if: always()
        run: python scripts/report_integration_tests.py >> $GITHUB_STEP_SUMMARY
