name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt (Lint)
        run: ./gradlew detekt

      - name: Build Project
        run: ./gradlew assemble

      - name: Run Tests and Coverage
        # Using check to run all tests compatible with the host (including Apple targets on macOS)
        run: ./gradlew check koverHtmlReport koverXmlReport

      - name: Report Test Results
        if: always()
        run: python scripts/report_tests.py >> $GITHUB_STEP_SUMMARY

      - name: Report Coverage
        if: always()
        run: python scripts/report_coverage.py >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          path: build/reports/kover/html

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    # Run on pushes to main (merges) OR pull requests originating from release/* branches
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Integration Tests
        run: ./gradlew :integration-tests:integrationTest -PTEST_MAL_CLIENT_ID=${{ secrets.TEST_MAL_CLIENT_ID }}

      - name: Report Integration Test Results
        if: always()
        run: python scripts/report_integration_tests.py >> $GITHUB_STEP_SUMMARY
